name: ProCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ProCam:
    type: application
    platform: iOS
    sources:
      - ProCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.procam
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ProCam
        INFOPLIST_KEY_NSCameraUsageDescription: "ProCam needs the camera to take photos and videos."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ProCam needs the microphone to record sound with your videos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "ProCam saves your photos and videos to your library."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
